name: One-Time AMP Cleanup

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  cleanup-amp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run AMP Cleanup Script
        run: python scripts/cleanup_amp.py

      - name: Commit and Push Deletions & Changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "✅ No AMP files found to clean."
          else
            git commit -m "🧹 Remove AMP files, strip amphtml tags, add 301 redirects [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
