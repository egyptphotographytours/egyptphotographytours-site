name: SEO Head-Tags Cleaner v6

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = report | commit = apply + push to default branch | pull-request = apply + open PR"
        type: choice
        options: [dry-run, commit, pull-request]
        default: dry-run
      site_dir:
        description: "Folder containing your .html pages (use . for repo root)"
        required: true
        default: "."
      fix_links:
        description: "Also rewrite internal <a href> links"
        type: choice
        options: ["no", "yes"]
        default: "no"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: head-tags-cleaner
  cancel-in-progress: false

jobs:
  clean-head-tags:
    runs-on: ubuntu-latest
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'dry-run' || inputs.mode }}
      SITE_DIR: ${{ inputs.site_dir || '.' }}
      FIX_LINKS: ${{ inputs.fix_links }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sanitize script line endings (CRLF guard)
        run: |
          if [ ! -f scripts/fix-head-tags.cjs ]; then
            echo "ERROR: scripts/fix-head-tags.cjs is missing. Add it to the repo first."
            exit 1
          fi
          sed -i 's/\r$//' scripts/fix-head-tags.cjs
          echo "Script ready."

      - name: Run the cleaner (repo)
        run: |
          D="$SITE_DIR"
          D="${D//\\/}"
          if [ -z "$D" ]; then D="."; fi
          if [ ! -d "$D" ]; then
            echo "WARNING: folder $D not found - using repo root"
            D="."
          fi
          ARGS="$D"
          if [ "$RUN_MODE" != "commit" ] && [ "$RUN_MODE" != "pull-request" ]; then
            ARGS="$ARGS --dry"
          fi
          if [ "$FIX_LINKS" = "yes" ]; then
            ARGS="$ARGS --links"
          fi
          echo "branch=${GITHUB_REF_NAME} mode=${RUN_MODE} folder=${D} links=${FIX_LINKS}"
          echo "command: node scripts/fix-head-tags.cjs ${ARGS}"
          node scripts/fix-head-tags.cjs ${ARGS}

      - name: Read results (decision gate)
        id: gate
        run: |
          if [ ! -f head-fix-changed.txt ]; then
            echo "ERROR: the cleaner produced no counters - check the step above for the real error."
            exit 1
          fi
          CHANGED="$(cat head-fix-changed.txt)"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${CHANGED}"
          if [ "${CHANGED}" = "0" ]; then
            echo "RESULT: repo already clean - nothing to commit (this is a success)."
            echo "### Result" >> "${GITHUB_SUMMARY:-/dev/null}"
            echo "Repo already clean. No changes, no commit." >> "${GITHUB_SUMMARY:-/dev/null}"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-fix-report
          path: |
            head-fix-report.txt
            head-fix-summary.json
          if-no-files-found: ignore

      - name: Package backups
        if: steps.gate.outputs.changed != '0' && env.RUN_MODE != 'dry-run' && github.event_name == 'workflow_dispatch'
        run: |
          if [ -d .head-fix-backups ]; then
            zip -qr head-fix-backups.zip .head-fix-backups
            echo "Backups zipped."
          fi

      - name: Upload backups artifact
        if: steps.gate.outputs.changed != '0' && env.RUN_MODE != 'dry-run' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: head-fix-backups
          path: head-fix-backups.zip
          if-no-files-found: ignore

      - name: Remove helper files before committing
        if: steps.gate.outputs.changed != '0' && env.RUN_MODE != 'dry-run' && github.event_name == 'workflow_dispatch'
        run: |
          rm -rf .head-fix-backups head-fix-backups.zip head-fix-changed.txt head-fix-summary.json
          if ! grep -qxF '.head-fix-backups/' .gitignore 2>/dev/null; then
            echo ".head-fix-backups/" >> .gitignore
          fi

      - name: Commit and push to the default branch (commit mode)
        if: env.RUN_MODE == 'commit' && steps.gate.outputs.changed != '0' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_COUNT: ${{ steps.gate.outputs.changed }}
        run: |
          git config user.name "sitemap-forge-bot"
          git config user.email "sitemap-forge-bot@users.noreply.github.com"
          git add '*.html' .gitignore
          if git diff --cached --quiet; then
            echo "No staged changes - nothing to commit."
            exit 0
          fi
          git commit -m "chore(seo): clean-URL canonical and hreflang on ${CHANGED_COUNT} pages (auto, validated)"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Pushed ${CHANGED_COUNT} fixed pages to ${GITHUB_REF_NAME}."
            echo "### Result" >> "${GITHUB_SUMMARY:-/dev/null}"
            echo "Committed and pushed **${CHANGED_COUNT} pages** to **${GITHUB_REF_NAME}**." >> "${GITHUB_SUMMARY:-/dev/null}"
          else
            echo "Direct push rejected (branch protection) - opening a Pull Request instead."
            BR="seo/head-tags-auto-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$BR"
            git push -u origin "$BR"
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BR" --title "SEO: clean canonical and hreflang on ${CHANGED_COUNT} pages (auto)" --body "Automated by SITEMAP FORGE v6 (safe deep clean). Originals are in the head-fix-backups artifact of this run. Review and merge to deploy."
            echo "### Result" >> "${GITHUB_SUMMARY:-/dev/null}"
            echo "Branch is protected - opened a **Pull Request** with ${CHANGED_COUNT} fixed pages." >> "${GITHUB_SUMMARY:-/dev/null}"
          fi

      - name: Open Pull Request (pull-request mode)
        if: env.RUN_MODE == 'pull-request' && steps.gate.outputs.changed != '0' && github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.ref_name }}
          branch: seo/clean-canonical-hreflang
          delete-branch: true
          add-paths: |
            *.html
            **/*.html
            .gitignore
          commit-message: "chore(seo): clean-URL canonical and hreflang (auto, validated)"
          title: "SEO: clean-URL canonical and hreflang across pages (automated)"
          body: |
            Automated by SITEMAP FORGE v6 (safe deep clean).
            - canonical / hreflang / og:url / JSON-LD converted to clean URLs
            - hreflang "zh" corrected to "zh-CN"
            - two-pass schema sweep with JSON.parse integrity gates
            - originals saved in the head-fix-backups artifact of this run
            Review the diff, then merge. Vercel deploys automatically.
