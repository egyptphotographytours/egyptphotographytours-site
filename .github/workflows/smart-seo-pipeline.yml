name: Smart Incremental Translation & SEO Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '!sitemap.xml'
      - '!scripts/**'
      - '!.github/**'
  workflow_dispatch:
    inputs:
      seo_only:
        description: 'Repair mode: only fix hreflang, language menus & sitemap (fast, no translation)'
        type: boolean
        default: false

# ✅ Prevents overlapping runs from killing each other
concurrency:
  group: translate-seo-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 deep-translator lxml translators

      - name: Configure Git for Pushing
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # ✅ Translation step — may be killed at 6h, that's OK
      - name: Run Translation Pipeline
        if: ${{ github.event.inputs.seo_only != 'true' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
        run: python scripts/smart_pipeline.py

      # ✅ SEO REPAIR — ALWAYS runs, even after the 6h kill
      # This is what adds hreflang + language menus to already-translated pages
      - name: SEO Repair (hreflang + language menus + sitemap)
        if: always()
        env:
          PYTHONUNBUFFERED: 1
        run: python scripts/smart_pipeline.py --seo-only

      # ✅ Final push — ALWAYS runs
      - name: Final Commit and Push
        if: always()
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "✅ No leftover changes. Everything already pushed!"
          else
            git commit -m "🤖 Final SEO, Sitemap & leftovers [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
