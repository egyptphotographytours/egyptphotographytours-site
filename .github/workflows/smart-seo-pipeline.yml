name: Smart SEO Patch & Translation Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '!sitemap.xml'
      - '!scripts/**'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  patch-and-translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 deep-translator lxml

      - name: Run Smart Patch, Translate & SEO Script
        run: python scripts/smart_pipeline.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Patch broken translations, fix language switcher & SEO [skip ci]"
            git push
          fi
