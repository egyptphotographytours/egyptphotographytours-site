name: Smart Incremental Translation & SEO Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '!sitemap.xml'
      - '!scripts/**'
      - '!.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 deep-translator lxml translators

      - name: Configure Git for Pushing
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run Smart Incremental Translation & SEO Script
        env:
          PYTHONUNBUFFERED: 1
        run: python scripts/smart_pipeline.py

      - name: Final Commit and Push
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "✅ No leftover changes. All batches pushed successfully!"
          else
            git commit -m "🤖 Final SEO, Sitemap & leftover translations [skip ci]"
            git push
          fi
