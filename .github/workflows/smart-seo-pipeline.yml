name: Smart Incremental Translation & SEO Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '!sitemap.xml'
      - '!scripts/**'
      - '!.github/**'
  workflow_dispatch:
    inputs:
      seo_only:
        description: '🔧 Repair mode: Fix DOM, hreflang, menus & sitemap (Fast, NO translation)'
        type: boolean
        default: false
      force_file:
        description: 'Force re-translate a specific file (e.g. index.html)'
        type: string
        required: false

# Prevents overlapping runs from killing each other
concurrency:
  group: translate-seo-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  translate-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 deep-translator lxml translators

      - name: Configure Git for Pushing
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # Translation step (Skipped if seo_only is checked)
      - name: Run Translation Pipeline
        if: ${{ github.event.inputs.seo_only != 'true' }}
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
        run: |
          if [ -n "${{ github.event.inputs.force_file }}" ]; then
            echo "🚀 Forcing translation for: ${{ github.event.inputs.force_file }}"
            python scripts/smart_pipeline.py --force-file "${{ github.event.inputs.force_file }}"
          else
            python scripts/smart_pipeline.py
          fi

      # SEO REPAIR — ALWAYS runs to ensure DOM is clean and Sitemap is perfect
      - name: SEO Repair (DOM Cleanup + hreflang + Sitemap)
        if: always()
        env:
          PYTHONUNBUFFERED: 1
        run: python scripts/smart_pipeline.py --seo-only

      # Final push
      - name: Final Commit and Push
        if: always()
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "✅ No leftover changes. Everything already pushed!"
          else
            git commit -m "🤖 Final SEO, Sitemap & DOM cleanup [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
