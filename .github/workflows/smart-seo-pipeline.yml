name: Smart Incremental Translation & SEO Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '!sitemap.xml'
      - '!scripts/**'
      - '!.github/**'
  workflow_dispatch: # Allows you to click "Run Workflow" manually from the Actions tab

permissions:
  contents: write

jobs:
  translate-and-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 2 is REQUIRED so the Python script can run `git diff HEAD~1 HEAD` 
          # to detect which English files you just changed for incremental translation.
          fetch-depth: 2 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 deep-translator lxml

      - name: Run Smart Incremental Translation & SEO Script
        env:
          # PYTHONUNBUFFERED: 1 forces Python to print logs instantly.
          # This prevents the "stuck at 5 minutes" illusion in the GitHub UI.
          PYTHONUNBUFFERED: 1  
        run: python scripts/smart_pipeline.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # [skip ci] prevents this commit from triggering the workflow again (infinite loop protection)
            git commit -m "🤖 Incremental translation, menu fix & SEO [skip ci]"
            git push
          fi
