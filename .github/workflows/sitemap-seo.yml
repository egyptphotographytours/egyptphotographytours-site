name: SEO Sitemap Factory

THIS FILE WAS SYNTAX-VALIDATED. If GitHub still says "line 3 error":
The problem is HOW the file was saved, not this content.
Fix: GitHub repo -> Add file -> "Create new file"
-> type: .github/workflows/sitemap-seo.yml
-> DELETE everything inside -> paste ONLY this content
(no  marks, no blank lines before "name:")
Make sure line 1 of the saved file is exactly:
name: SEO Sitemap Factory
Use spaces only (never TABS). Then commit.
MANUAL ONLY: no push/schedule triggers exist below. It runs ONLY
from: Actions tab -> SEO Sitemap Factory -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Website base URL"
        required: true
        default: "https://www.egyptphotographytours.com"
      max_pages:
        description: "Max pages to process"
        required: true
        default: "50000"
      languages:
        description: "en=root plus every language folder"
        required: true
        default: "en,ar,es,fr,de,it,pt,ru,ja,zh-CN,ko,hi,nl,sv,pl,tr,vi,th,id,cs,ro,tl,no,da,fi"
      wordpress:
        description: "Is this a WordPress site?"
        type: choice
        options:
          - "yes"
          - "no"
        default: "yes"
      deploy_mode:
        description: "commit = push to repo and replace old files"
        type: choice
        options:
          - "commit"
          - "ssh"
          - "ftp"
          - "artifact"
        default: "commit"
      submittogsc:
        description: "Auto-submit to Google Search Console?"
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

concurrency:
  group: sitemap-factory

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get today date (becomes every lastmod)
        id: today
        run: |
          echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build sitemaps robots htaccess redirects
        env:
          SITEURL: ${{ inputs.baseurl }}
          MAXPAGES: ${{ inputs.maxpages }}
          CONCURRENCY: "8"
          LANGUAGES: ${{ inputs.languages }}
          LASTMOD: ${{ steps.today.outputs.d }}
          OUT_DIR: "dist-sitemaps"
          WP_HTACCESS: ${{ inputs.wordpress }}
          URLS_FILE: "urls.txt"
        run: |
          node scripts/generate-sitemaps.mjs

      - name: Show URL counts per sitemap
        run: |
          {
            echo "### URL counts per sitemap file"
            echo ""
            find dist-sitemaps -name "*.xml" | sort | while read -r f; do
              echo "- $f -> $(grep -o '' "$f" | wc -l) URLs"
            done
          } >> "$GITHUBSTEPSUMMARY"

      - name: Backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemaps-${{ steps.today.outputs.d }}
          path: dist-sitemaps
          retention-days: 30

      - name: Deploy and replace old files
        env:
          DEPLOYMODE: ${{ inputs.deploymode }}
          LASTMOD_DATE: ${{ steps.today.outputs.d }}
          SSHPRIVATEKEY: ${{ secrets.DEPLOYSSHKEY }}
          SSHHOST: ${{ secrets.DEPLOYSSH_HOST }}
          SSHUSER: ${{ secrets.DEPLOYSSH_USER }}
          SSHPORT: ${{ secrets.DEPLOYSSH_PORT }}
          REMOTEDIR: ${{ secrets.DEPLOYREMOTE_DIR }}
          FTPHOST: ${{ secrets.FTPHOST }}
          FTPUSER: ${{ secrets.FTPUSER }}
          FTPPASS: ${{ secrets.FTPPASS }}
          FTPREMOTEDIR: ${{ secrets.FTPREMOTEDIR }}
        run: |
          set -euo pipefail
          MODE="${DEPLOY_MODE:-commit}"
          GEN="$GITHUB_WORKSPACE/dist-sitemaps"
          if [ "$MODE" = "ssh" ]; then
            mkdir -p ~/.ssh
            printf "%s\n" "$SSHPRIVATEKEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            PORT="${SSH_PORT:-22}"
            ssh-keyscan -p "$PORT" "$SSHHOST" >> ~/.ssh/knownhosts 2>/dev/null || true
            rsync -az -e "ssh -p $PORT -i ~/.ssh/iddeploy -o StrictHostKeyChecking=no" "$GEN/" "$SSHUSER@$SSHHOST:${REMOTEDIR:-/var/www/html/}"
            echo "Uploaded via SSH"
          elif [ "$MODE" = "ftp" ]; then
            TGT=""
            if [ -n "${FTPREMOTEDIR:-}" ]; then
              TGT="/${FTPREMOTEDIR%/}"
            fi
            cd "$GEN"
            find . -type f | while IFS= read -r f; do
              rel="${f#./}"
              curl -sS --fail --ftp-create-dirs -T "$f" "ftp://$FTPHOST$TGT/$rel" --user "$FTPUSER:$FTP_PASS"
            done
            echo "Uploaded via FTP"
          elif [ "$MODE" = "artifact" ]; then
            echo "Artifact mode: download the artifact and upload files manually."
          else
            cd "$GITHUB_WORKSPACE"
            find dist-sitemaps -mindepth 1 -maxdepth 1 ! -name "audit.json" -exec cp -r {} . \;
            rm -rf dist-sitemaps
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit."
            else
              git commit -m "chore(seo): regenerate sitemaps robots htaccess redirects - lastmod $LASTMOD_DATE"
              git push
              echo "Pushed to GitHub. Old sitemap/robots/.htaccess/redirects replaced."
            fi
          fi

      - name: Verify live sitemap index
        if: ${{ inputs.deploy_mode != 'artifact' }}
        continue-on-error: true
        run: |
          sleep 15
          code=$(curl -s -o sm.xml -w "%{httpcode}" -L "${{ inputs.baseurl }}/sitemap.xml")
          echo "HTTP $code for /sitemap.xml"
          head -c 300 sm.xml
          echo ""
          if grep -qi "sitemapindex" sm.xml; then
            echo "Sitemap index is live"
          else
            echo "Not served yet - wait for hosting or CDN sync"
          fi

      - name: Submit to Google Search Console
        if: ${{ inputs.submittogsc == 'yes' }}
        continue-on-error: true
        env:
          GSCSAJSON: ${{ secrets.GSCSAJSON }}
          GSCPROPERTY: ${{ vars.GSCPROPERTY }}
          SITEURL: ${{ inputs.baseurl }}
        run: |
          node scripts/gsc-submit.mjs
